<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光斑 · 生长 · 荆棘 · 消散</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const T_BLACK_END = 2;
    const T_SPOT_FAST = 4;
    const T_GROW_END = 15;
    const T_THORN_END = 17.5;
    const T_END = 20;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const tmpCol = new THREE.Color();
    const tmpColB = new THREE.Color();

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0.35, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.28,
      0.32,
      0.9
    );
    composer.addPass(bloom);

    function clamp01(x) { return Math.min(1, Math.max(0, x)); }
    function smoothstep(edge0, edge1, x) {
      const t = clamp01((x - edge0) / (edge1 - edge0));
      return t * t * (3 - 2 * t);
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    const rnd = (a, b) => a + Math.random() * (b - a);

    /* --- Core: point cloud --- */
    const CORE_COUNT = 10000;
    const coreGeo = new THREE.BufferGeometry();
    const corePos = new Float32Array(CORE_COUNT * 3);
    const coreBase = new Float32Array(CORE_COUNT * 3);
    const coreVel = new Float32Array(CORE_COUNT * 3);

    for (let i = 0; i < CORE_COUNT; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const r = Math.cbrt(Math.random());
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);
      const j = i * 3;
      coreBase[j] = x;
      coreBase[j + 1] = y;
      coreBase[j + 2] = z;
      coreVel[j] = rnd(-0.018, 0.018);
      coreVel[j + 1] = rnd(-0.018, 0.018);
      coreVel[j + 2] = rnd(-0.018, 0.018);
    }
    coreGeo.setAttribute("position", new THREE.BufferAttribute(corePos, 3));
    const coreMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.042,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    const corePoints = new THREE.Points(coreGeo, coreMat);
    scene.add(corePoints);

    /* --- Core halo: soft concentric glow (过程图 2–4 光晕层次) --- */
    const HALO_COUNT = 1600;
    const haloGeo = new THREE.BufferGeometry();
    const haloPos = new Float32Array(HALO_COUNT * 3);
    const haloBase = new Float32Array(HALO_COUNT * 3);
    for (let i = 0; i < HALO_COUNT; i++) {
      const shell = (i % 9) / 8;
      const shellR = 0.18 + shell * 0.82;
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const x = shellR * Math.sin(phi) * Math.cos(theta);
      const y = shellR * Math.sin(phi) * Math.sin(theta);
      const z = shellR * Math.cos(phi);
      const j = i * 3;
      haloBase[j] = x;
      haloBase[j + 1] = y;
      haloBase[j + 2] = z;
    }
    haloGeo.setAttribute("position", new THREE.BufferAttribute(haloPos, 3));
    const haloMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.085,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    const haloPoints = new THREE.Points(haloGeo, haloMat);
    scene.add(haloPoints);

    /* --- Branch volume: thin halo along lines (readability + bulk) --- */
    const VOL_MAX = 16000;
    const volStore = new Float32Array(VOL_MAX * 3);
    let volHead = 0;
    let volSize = 0;
    const branchVolGeo = new THREE.BufferGeometry();
    const branchVolPos = new Float32Array(VOL_MAX * 3);
    branchVolGeo.setAttribute("position", new THREE.BufferAttribute(branchVolPos, 3));
    const branchVolMat = new THREE.PointsMaterial({
      color: 0xfff4ee,
      size: 0.022,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    const branchVolPoints = new THREE.Points(branchVolGeo, branchVolMat);
    scene.add(branchVolPoints);

    function addVolParticle(x, y, z) {
      const j = volHead * 3;
      volStore[j] = x;
      volStore[j + 1] = y;
      volStore[j + 2] = z;
      volHead = (volHead + 1) % VOL_MAX;
      if (volSize < VOL_MAX) volSize++;
    }

    function pushBranchFlesh(prev, tip, b, thornWindow, growSilk) {
      const dx = tip.x - prev.x;
      const dy = tip.y - prev.y;
      const dz = tip.z - prev.z;
      const segLen = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (segLen < 1e-5) return;
      const inv = 1 / segLen;
      const nx = dx * inv;
      const ny = dy * inv;
      const nz = dz * inv;
      let ox = 0;
      let oy = 1;
      let oz = 0;
      if (Math.abs(ny) > 0.92) {
        ox = 1;
        oy = 0;
        oz = 0;
      }
      let px = oy * nz - oz * ny;
      let py = oz * nx - ox * nz;
      let pz = ox * ny - oy * nx;
      let pl = Math.sqrt(px * px + py * py + pz * pz) || 1;
      px /= pl;
      py /= pl;
      pz /= pl;
      let qx = ny * pz - nz * py;
      let qy = nz * px - nx * pz;
      let qz = nx * py - ny * px;
      pl = Math.sqrt(qx * qx + qy * qy + qz * qz) || 1;
      qx /= pl;
      qy /= pl;
      qz /= pl;

      const genTaper = Math.max(0.28, 1 - b.gen * 0.1);
      const lenTaper = Math.pow(Math.max(0, 1 - b.len / (b.maxLen * 1.35)), 0.48);
      const silk = thornWindow ? 0.88 : 0.5 + 0.5 * growSilk;
      let r0 = 0.052 * genTaper * lenTaper * silk;
      if (thornWindow) r0 *= 1.05;

      const rings = 4;
      const steps = Math.max(2, Math.min(6, Math.floor(segLen / 0.045)));
      for (let i = 0; i < steps; i++) {
        const u = (i + 0.5) / steps;
        const bx = prev.x + dx * u;
        const by = prev.y + dy * u;
        const bz = prev.z + dz * u;
        const twist = b.phase + u * 1.9 + b.gen * 0.4;
        const ru =
          r0 *
          (0.5 + 0.5 * Math.sqrt(1 - u * 0.68)) *
          (thornWindow ? 0.9 + 0.1 * Math.sin(u * Math.PI * 7) : 1);
        for (let k = 0; k < rings; k++) {
          const ang = (k / rings) * Math.PI * 2 + twist;
          const rr = ru * (0.68 + 0.32 * Math.random());
          const c = Math.cos(ang);
          const s = Math.sin(ang);
          const jx = (px * c + qx * s) * rr;
          const jy = (py * c + qy * s) * rr;
          const jz = (pz * c + qz * s) * rr;
          const gn = (thornWindow ? 0.06 : 0.035) * ru * Math.sin(ang * 2 + b.phase);
          addVolParticle(bx + jx + nx * gn, by + jy + ny * gn, bz + jz + nz * gn);
          if (thornWindow && Math.random() < 0.55) {
            const sp = ru * (1.15 + Math.random() * 0.9);
            const sang = Math.random() * Math.PI * 2;
            const tx = (px * Math.cos(sang) + qx * Math.sin(sang)) * sp * 0.35 + nx * sp * 0.65;
            const ty = (py * Math.cos(sang) + qy * Math.sin(sang)) * sp * 0.35 + ny * sp * 0.65;
            const tz = (pz * Math.cos(sang) + qz * Math.sin(sang)) * sp * 0.35 + nz * sp * 0.65;
            addVolParticle(bx + tx, by + ty, bz + tz);
          }
        }
      }
    }

    function syncBranchVolumeBuffer(dissolve, t) {
      const attr = branchVolGeo.attributes.position;
      const out = attr.array;
      const burst = dissolve;
      if (volSize === 0) {
        branchVolGeo.setDrawRange(0, 0);
        branchVolMat.opacity = 0;
        return;
      }
      let di = 0;
      if (volSize < VOL_MAX) {
        for (let i = 0; i < volSize; i++) {
          const sj = i * 3;
          let x = volStore[sj];
          let y = volStore[sj + 1];
          let z = volStore[sj + 2];
          if (burst > 0.001) {
            const h = i * 0.6180339;
            x += Math.sin(h * 11.17) * 48 * burst;
            y += Math.cos(h * 7.91) * 48 * burst;
            z += Math.sin(h * 9.23 + 1.7) * 48 * burst;
          }
          const o = di * 3;
          out[o] = x;
          out[o + 1] = y;
          out[o + 2] = z;
          di++;
        }
      } else {
        for (let i = 0; i < VOL_MAX; i++) {
          const si = ((volHead + i) % VOL_MAX) * 3;
          let x = volStore[si];
          let y = volStore[si + 1];
          let z = volStore[si + 2];
          if (burst > 0.001) {
            const h = i * 0.6180339;
            x += Math.sin(h * 11.17) * 48 * burst;
            y += Math.cos(h * 7.91) * 48 * burst;
            z += Math.sin(h * 9.23 + 1.7) * 48 * burst;
          }
          const o = i * 3;
          out[o] = x;
          out[o + 1] = y;
          out[o + 2] = z;
        }
        di = VOL_MAX;
      }
      attr.needsUpdate = true;
      branchVolGeo.setDrawRange(0, di);
      const thM = smoothstep(T_GROW_END, T_THORN_END, t);
      branchVolMat.opacity = (t >= T_SPOT_FAST ? lerp(0.32, 0.38, thM) : 0) * (1 - burst * 0.9);
      branchVolMat.size = 0.019 + (1 - burst) * 0.009 + thM * 0.006;
    }

    /* --- Line segments (branches) --- */
    const MAX_SEG = 16000;
    const lineGeo = new THREE.BufferGeometry();
    const linePos = new Float32Array(MAX_SEG * 2 * 3);
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
    const lineMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const lines = new THREE.LineSegments(lineGeo, lineMat);

    const segments = [];
    function trimSegments() {
      while (segments.length > MAX_SEG) segments.shift();
    }

    class Branch {
      constructor(origin, dir, gen) {
        this.tip = origin.clone();
        this.dir = dir.clone().normalize();
        this.smoothDir = this.dir.clone();
        this.gen = gen;
        this.len = 0;
        this.maxLen = rnd(0.78, 1.82) / (gen * 0.36 + 1);
        this.speed = rnd(0.021, 0.044);
        this.phase = rnd(0, Math.PI * 2);
        this.volStride = 0;
        this.turnBias = rnd(-0.35, 0.35);
      }
    }

    const branches = [];
    let spawnAcc = 0;
    const tmpV = new THREE.Vector3();
    const tmpV2 = new THREE.Vector3();
    const tmpV3 = new THREE.Vector3();
    const tmpV4 = new THREE.Vector3();
    const axisY = new THREE.Vector3(0, 1, 0);

    function resetSimulation() {
      spawnAcc = 0;
      branches.length = 0;
      segments.length = 0;
      volHead = 0;
      volSize = 0;
      flowerWrite = 0;
      for (let i = 0; i < CORE_COUNT; i++) {
        const j = i * 3;
        coreVel[j] = rnd(-0.02, 0.02);
        coreVel[j + 1] = rnd(-0.02, 0.02);
        coreVel[j + 2] = rnd(-0.02, 0.02);
      }
    }

    function pushSeg(a, b) {
      segments.push({ ax: a.x, ay: a.y, az: a.z, bx: b.x, by: b.y, bz: b.z });
      trimSegments();
    }

    function flushLinesToBuffer(dissolve, t) {
      const n = Math.min(segments.length, MAX_SEG);
      let o = 0;
      const d = dissolve;
      const shake = d * 0.35;
      for (let i = 0; i < n; i++) {
        const s = segments[segments.length - n + i];
        const j = o;
        linePos[j] = s.ax + (Math.random() - 0.5) * shake;
        linePos[j + 1] = s.ay + (Math.random() - 0.5) * shake;
        linePos[j + 2] = s.az + (Math.random() - 0.5) * shake;
        linePos[j + 3] = s.bx + (Math.random() - 0.5) * shake;
        linePos[j + 4] = s.by + (Math.random() - 0.5) * shake;
        linePos[j + 5] = s.bz + (Math.random() - 0.5) * shake;
        o += 6;
      }
      lineGeo.setDrawRange(0, n * 2);
      lineGeo.attributes.position.needsUpdate = true;
      lineMat.opacity = (1 - d * 0.95) * (t >= T_SPOT_FAST ? 0.88 : 0);
    }

    /* Flowers */
    const FLOWER_PTS = 4000;
    const flowerGeo = new THREE.BufferGeometry();
    const flowerPos = new Float32Array(FLOWER_PTS * 3);
    flowerGeo.setAttribute("position", new THREE.BufferAttribute(flowerPos, 3));
    const flowerMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.03,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const flowerPoints = new THREE.Points(flowerGeo, flowerMat);
    scene.add(flowerPoints);
    let flowerWrite = 0;

    function addFlowerPetal(tip) {
      if (flowerWrite >= FLOWER_PTS) return;
      const petals = 7;
      const ring = Math.floor(flowerWrite / petals) % 4;
      const p = flowerWrite % petals;
      const ang = (p / petals) * Math.PI * 2 + ring * 0.4;
      const rr = 0.085 + ring * 0.042;
      const j = flowerWrite * 3;
      flowerPos[j] = tip.x + Math.cos(ang) * rr;
      flowerPos[j + 1] = tip.y + Math.sin(ang * 1.05) * rr * 0.9;
      flowerPos[j + 2] = tip.z + Math.sin(ang * 0.9) * rr * 0.5;
      flowerWrite++;
    }

    /* Wrap ribbons */
    const WRAP_RINGS = 12;
    const wrapPtsPerRing = 140;
    const WRAP_SHELL = 2;
    const wrapGeo = new THREE.BufferGeometry();
    const wrapCount = WRAP_RINGS * wrapPtsPerRing * WRAP_SHELL;
    const wrapPos = new Float32Array(wrapCount * 3);
    wrapGeo.setAttribute("position", new THREE.BufferAttribute(wrapPos, 3));
    const wrapMat = new THREE.PointsMaterial({
      color: 0xfff8f4,
      size: 0.022,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const wrapPoints = new THREE.Points(wrapGeo, wrapMat);
    scene.add(wrapPoints);
    scene.add(lines);

    function updateWrap(t, coreRadius, dissolve) {
      const thornT = smoothstep(T_GROW_END, T_THORN_END, t);
      const show = smoothstep(T_GROW_END + 0.04, T_GROW_END + 0.85, t);
      const choke = smoothstep(T_GROW_END, T_THORN_END - 0.15, t);
      const pull = smoothstep(0, 1, choke);
      const radiusMul = lerp(1.45, 0.7, choke);
      const cr = coreRadius * radiusMul;
      const layersPerSide = WRAP_RINGS / 2;
      let idx = 0;
      for (let r = 0; r < WRAP_RINGS; r++) {
        const side = r < layersPerSide ? -1 : 1;
        const lr = r % layersPerSide;
        const spin = t * (2.2 + lr * 0.18) * (4 + thornT * 10) * side;
        for (let i = 0; i < wrapPtsPerRing; i++) {
          const u = i / wrapPtsPerRing;
          const ang = u * Math.PI * 2 * 5 + spin + lr * 1.1;
          const armReach = cr * lerp(2.35, 0.95, pull);
          const startX = side * armReach * (0.55 + 0.45 * Math.sin(u * Math.PI * 2 + lr * 0.4));
          const startY = Math.sin(u * Math.PI * 2 * 2 + lr) * cr * 0.32;
          const startZ = Math.cos(u * Math.PI * 2 * 2 + lr * 0.7) * cr * 0.3;
          const wrapY = Math.sin(ang) * cr * 0.92;
          const wrapZ = Math.cos(ang * 1.08 + side * 0.4) * cr * 0.88;
          const wrapX = side * (Math.sin(ang * 2 + lr * 0.6) * cr * 0.52 + Math.cos(ang * 3) * cr * 0.22);
          let x = lerp(startX, wrapX, pull);
          let y = lerp(startY, wrapY, pull);
          let z = lerp(startZ, wrapZ, pull);
          const spike = thornT * Math.sin(u * Math.PI * 41 + lr) * cr * 0.22;
          x += spike * side;
          y += spike * 0.45 * Math.sin(u * Math.PI * 18);
          z += spike * 0.4 * Math.cos(u * Math.PI * 14);
          const squeeze = 1 - choke * 0.12;
          x *= squeeze;
          y *= squeeze;
          z *= squeeze;
          const len = Math.max(0.04, Math.sqrt(x * x + y * y + z * z));
          const invL = 1 / len;
          const rx = x * invL;
          const ry = y * invL;
          const rz = z * invL;
          const shellAmt = cr * (0.065 + thornT * 0.095) * (0.45 + 0.55 * Math.sin(u * Math.PI * 18 + lr));
          for (let shell = 0; shell < WRAP_SHELL; shell++) {
            const sign = shell === 0 ? 1 : -1;
            const j = idx * 3;
            wrapPos[j] = x + rx * shellAmt * sign;
            wrapPos[j + 1] = y + ry * shellAmt * sign;
            wrapPos[j + 2] = z + rz * shellAmt * sign;
            idx++;
          }
        }
      }
      wrapGeo.attributes.position.needsUpdate = true;
      wrapMat.opacity = show * (1 - dissolve * 0.92) * 0.94;
      wrapMat.size = 0.018 + thornT * 0.042;
    }

    function coreRadiusAt(t) {
      if (t < T_BLACK_END) return 0;
      if (t < T_SPOT_FAST) {
        const u = smoothstep(T_BLACK_END, T_SPOT_FAST, t);
        return lerp(0.12, 0.92, u);
      }
      if (t < T_GROW_END) {
        const u = smoothstep(T_SPOT_FAST, T_GROW_END, t);
        return lerp(0.92, 1.58, u);
      }
      if (t < T_THORN_END) {
        const u = smoothstep(T_GROW_END, T_THORN_END, t);
        return lerp(1.58, 1.3, u * 0.42);
      }
      const u = smoothstep(T_THORN_END, T_END, t);
      return lerp(1.3, 1.48, u * 0.15);
    }

    function updateCore(t, dissolve) {
      const coreR = coreRadiusAt(t);
      const posAttr = coreGeo.attributes.position;
      const arr = posAttr.array;
      for (let i = 0; i < CORE_COUNT; i++) {
        const j = i * 3;
        let bx = coreBase[j] * coreR;
        let by = coreBase[j + 1] * coreR;
        let bz = coreBase[j + 2] * coreR;
        if (dissolve > 0.001) {
          const burst = dissolve * (2 + Math.sin(i * 12.9898) * 0.5);
          arr[j] = bx + coreVel[j] * 70 * burst;
          arr[j + 1] = by + coreVel[j + 1] * 70 * burst;
          arr[j + 2] = bz + coreVel[j + 2] * 70 * burst;
        } else {
          const breathe = 1 + 0.035 * Math.sin(t * 2.8 + i * 0.008);
          arr[j] = bx * breathe;
          arr[j + 1] = by * breathe;
          arr[j + 2] = bz * breathe;
        }
      }
      posAttr.needsUpdate = true;

      const vis = t >= T_BLACK_END ? 1 : 0;
      const thM = smoothstep(T_GROW_END - 0.4, T_THORN_END, t);
      tmpCol.setRGB(1, 1, 1);
      tmpCol.lerp(new THREE.Color(0xfff3e0), smoothstep(T_SPOT_FAST, T_GROW_END * 0.5, t) * 0.45);
      tmpCol.lerp(new THREE.Color(0xffc990), thM * 0.5);
      tmpCol.lerp(new THREE.Color(0xc73b12), dissolve * 0.88);
      coreMat.color.copy(tmpCol);
      coreMat.opacity = vis * (1 - dissolve) * lerp(1, 0.38, dissolve * dissolve);
      coreMat.size = 0.034 + (1 - dissolve) * 0.022 + smoothstep(T_BLACK_END, T_SPOT_FAST, t) * 0.012;
      bloom.strength =
        lerp(0.35, 1.38, smoothstep(T_BLACK_END, T_SPOT_FAST, t)) *
        (1 - dissolve * 0.5) *
        lerp(1, 0.72, thM * 0.35);
    }

    function updateHalo(t, dissolve) {
      const coreR = coreRadiusAt(t);
      const attr = haloGeo.attributes.position;
      const arr = attr.array;
      const thM = smoothstep(T_GROW_END, T_THORN_END, t);
      for (let i = 0; i < HALO_COUNT; i++) {
        const j = i * 3;
        const breathe = 1 + 0.022 * Math.sin(t * 2.1 + i * 0.019);
        arr[j] = haloBase[j] * coreR * 1.1 * breathe;
        arr[j + 1] = haloBase[j + 1] * coreR * 1.1 * breathe;
        arr[j + 2] = haloBase[j + 2] * coreR * 1.1 * breathe;
      }
      attr.needsUpdate = true;
      const spot = smoothstep(T_BLACK_END, T_SPOT_FAST, t);
      const rings = smoothstep(T_SPOT_FAST - 0.2, T_GROW_END - 1, t) * (1 - thM * 0.9);
      haloMat.opacity =
        (t >= T_BLACK_END ? 1 : 0) *
        (lerp(0, 0.18, spot) + lerp(0, 0.36, rings)) *
        (1 - dissolve * 0.82);
      tmpCol.setRGB(1, 1, 1).lerp(new THREE.Color(0xffecd6), spot * 0.25 + rings * 0.35);
      tmpCol.lerp(new THREE.Color(0xffc080), thM * 0.45);
      haloMat.color.copy(tmpCol);
      haloMat.size = 0.055 + spot * 0.05 + rings * 0.035;
    }

    function applyVisualPhase(t, dissolve) {
      const thM = smoothstep(T_GROW_END, T_THORN_END, t);
      const brownWood = smoothstep(T_GROW_END - 2.4, T_GROW_END + 1.1, t) * (1 - dissolve * 0.35);
      tmpCol.setRGB(0.98, 0.98, 1).lerp(new THREE.Color(0x5c3e26), brownWood * 0.92);
      lineMat.color.copy(tmpCol);
      tmpColB.setRGB(1, 0.96, 0.92).lerp(new THREE.Color(0x4a3018), brownWood * 0.9);
      branchVolMat.color.copy(tmpColB);
      const wrapDark = smoothstep(T_GROW_END - 0.2, T_THORN_END, t);
      tmpCol.setRGB(1, 0.97, 0.93).lerp(new THREE.Color(0x1f130d), wrapDark * 0.92);
      wrapMat.color.copy(tmpCol);
      tmpCol.setRGB(1, 0.98, 0.95).lerp(new THREE.Color(0xffe0c2), thM * 0.25);
      flowerMat.color.copy(tmpCol);
      const env = smoothstep(T_GROW_END - 2, T_END, t);
      tmpCol.setRGB(0.038, 0.037, 0.04).lerp(new THREE.Color(0.11, 0.065, 0.045), env * 0.65 + dissolve * 0.28);
      scene.background.copy(tmpCol);
    }

    function simulate(dt, t) {
      const dissolve = smoothstep(T_THORN_END, T_END, t);
      const growWindow = t >= T_SPOT_FAST && t < T_GROW_END;
      const thornWindow = t >= T_GROW_END && t < T_THORN_END;
      const growProgress = growWindow ? smoothstep(T_SPOT_FAST, T_GROW_END, t) : 0;
      const growEaseIn = smoothstep(T_SPOT_FAST, T_SPOT_FAST + 2.2, t);
      const growEaseOut = growWindow ? smoothstep(T_GROW_END - 2.5, T_GROW_END, t) : 0;
      const growSilk = growEaseIn * (1 - growEaseOut * 0.35);

      if (t < T_SPOT_FAST - 0.001 || t >= T_THORN_END) {
        flushLinesToBuffer(dissolve, t);
        return;
      }

      const coreR = coreRadiusAt(t);
      const thornMix = smoothstep(T_GROW_END, T_THORN_END, t);
      const jitter = thornMix * 0.28;
      const steps = thornWindow ? 4 : 2;

      const spawnRateGrow = lerp(6, 14, growSilk) * (0.4 + 0.6 * growProgress);

      for (let step = 0; step < steps; step++) {
        spawnAcc += dt * (growWindow ? spawnRateGrow : 52);
        while (spawnAcc >= 1 && branches.length < 500) {
          spawnAcc -= 1;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          tmpV2.set(
            Math.sin(phi) * Math.cos(theta),
            Math.sin(phi) * Math.sin(theta),
            Math.cos(phi)
          );
          tmpV2.y += rnd(0.06, 0.34);
          tmpV2.x += rnd(-0.28, 0.28);
          tmpV2.z += rnd(-0.28, 0.28);
          tmpV2.normalize();
          const origin = tmpV2.clone().multiplyScalar(coreR * rnd(0.22, 1.02));
          branches.push(new Branch(origin, tmpV2.clone(), 0));
        }

        for (let bi = branches.length - 1; bi >= 0; bi--) {
          const b = branches[bi];
          const prev = b.tip.clone();
          const spd =
            b.speed *
            (thornWindow ? 2.5 : 1) *
            (growWindow ? lerp(0.72, 1.05, growSilk) : 1);
          b.len += (spd * dt * 48) / steps;

          tmpV.copy(b.dir);
          if (thornWindow) {
            tmpV2.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(jitter);
            tmpV.add(tmpV2);
            tmpV2.copy(b.smoothDir).negate().multiplyScalar(0.12 * thornMix);
            tmpV.add(tmpV2);
            tmpV4.copy(b.tip);
            const dT = tmpV4.length();
            if (dT > 0.05) {
              tmpV4.multiplyScalar(-1 / dT);
              tmpV.addScaledVector(tmpV4, 0.16 * thornMix + 0.05 * jitter);
            }
          } else {
            b.turnBias += rnd(-0.055, 0.055) * (dt * 50) / steps;
            b.turnBias *= 0.988;
            b.turnBias = Math.max(-0.9, Math.min(0.9, b.turnBias));

            tmpV2.crossVectors(axisY, b.smoothDir);
            if (tmpV2.lengthSq() < 1e-6) tmpV2.set(1, 0, 0).cross(b.smoothDir);
            tmpV2.normalize();
            tmpV3.crossVectors(b.smoothDir, tmpV2).normalize();

            const genSoft = 1 / (1 + b.gen * 0.55);
            const axisAmp = lerp(0.038, 0.12, genSoft) * growSilk;
            const uLen = b.len * 1.25 + b.phase;
            const low1 = Math.sin(uLen + t * 0.48) * axisAmp;
            const low2 = Math.cos(uLen * 0.85 + t * 0.35 + b.phase * 0.4) * axisAmp * 0.72;
            tmpV.addScaledVector(tmpV2, low1 + b.turnBias * 0.065 * growSilk);
            tmpV.addScaledVector(tmpV3, low2);

            const horiz = Math.hypot(b.smoothDir.x, b.smoothDir.z);
            const sag =
              0.058 *
              horiz *
              Math.pow(b.len / Math.max(b.maxLen, 0.02), 1.15) *
              growSilk *
              (1 + b.gen * 0.28);
            tmpV.y -= sag;
            tmpV.y += 0.018 * (1 - b.gen * 0.22) * growSilk;

            const wrapIn = smoothstep(T_GROW_END - 3.5, T_GROW_END + 0.3, t);
            tmpV4.copy(b.tip);
            const dTip = tmpV4.length();
            if (dTip > 0.07) {
              tmpV4.multiplyScalar(-1 / dTip);
              tmpV.addScaledVector(tmpV4, 0.085 * wrapIn * growSilk);
            }
          }
          tmpV.normalize();
          const steer = thornWindow ? 0.42 : lerp(0.065, 0.12, growSilk);
          b.smoothDir.lerp(tmpV, steer);
          b.smoothDir.normalize();
          b.dir.copy(b.smoothDir);
          const tipSlow = 1 - 0.26 * Math.pow(b.len / Math.max(b.maxLen, 0.02), 1.25);
          const reach = growWindow ? 1.06 : 1;
          b.tip.addScaledVector(
            b.smoothDir,
            ((spd * dt * 52) / steps) * reach * Math.max(0.55, tipSlow)
          );

          pushSeg(prev, b.tip);
          b.volStride++;
          const volEvery = thornWindow ? 2 : 2;
          if (b.volStride % volEvery === 0) {
            pushBranchFlesh(prev, b.tip, b, thornWindow, growSilk);
          }

          if (growWindow && Math.random() < 0.068 * growSilk) addFlowerPetal(b.tip);

          const maxScale = thornWindow ? 2.4 : 1;
          if (b.len > b.maxLen * maxScale) {
            if (growWindow && branches.length < 480 && Math.random() < 0.5 * growSilk) {
              tmpV2.crossVectors(axisY, b.smoothDir);
              if (tmpV2.lengthSq() < 1e-5) tmpV2.set(1, 0, 0).cross(b.smoothDir);
              tmpV2.normalize();
              const roll = rnd(-0.22, 0.22);
              const pick = Math.random();
              if (pick < 0.4) {
                tmpV.copy(b.smoothDir).applyAxisAngle(tmpV2, rnd(-0.18, 0.26) + roll * 0.12).normalize();
                branches.push(new Branch(b.tip.clone(), tmpV, b.gen + 1));
              } else if (pick < 0.76) {
                const ang = rnd(0.5, 1.05) * (Math.random() < 0.5 ? 1 : -1);
                tmpV.copy(b.smoothDir).applyAxisAngle(tmpV2, ang + roll * 0.08).normalize();
                branches.push(new Branch(b.tip.clone(), tmpV, b.gen + 1));
              } else {
                tmpV.copy(b.smoothDir).applyAxisAngle(tmpV2, rnd(0.06, 0.2) + roll * 0.06).normalize();
                branches.push(new Branch(b.tip.clone(), tmpV, b.gen + 1));
                tmpV.copy(b.smoothDir).applyAxisAngle(tmpV2, rnd(0.52, 1.02) * (Math.random() < 0.5 ? 1 : -1)).normalize();
                branches.push(new Branch(b.tip.clone(), tmpV, b.gen + 1));
              }
            }
            if (thornWindow && Math.random() < 0.35) {
              tmpV2.copy(b.dir).multiplyScalar(-0.3).add(
                new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(0.6)
              ).normalize();
              branches.push(new Branch(b.tip.clone(), tmpV2, b.gen + 1));
            }
            branches.splice(bi, 1);
          }
        }
      }

      if (thornWindow && branches.length < 200) {
        for (let k = 0; k < 12; k++) {
          const side = k % 2 === 0 ? -1 : 1;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          tmpV.set(
            Math.sin(phi) * Math.cos(theta),
            Math.sin(phi) * Math.sin(theta),
            Math.cos(phi)
          );
          const origin = tmpV.clone().multiplyScalar(coreR * rnd(0.15, 0.95));
          tmpV2.set(side * rnd(0.4, 1), rnd(-0.35, 0.35), rnd(-0.35, 0.35)).normalize();
          branches.push(new Branch(origin, tmpV2, 1));
        }
      }

      flushLinesToBuffer(dissolve, t);

      flowerGeo.setDrawRange(0, flowerWrite);
      flowerGeo.attributes.position.needsUpdate = true;
      flowerMat.opacity = growWindow ? 0.55 * (1 - thornMix) * (1 - dissolve) : 0;
      flowerMat.size = 0.024 + thornMix * 0.014;
    }

    let globalT = 0;
    const clock = new THREE.Clock();

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      globalT += dt;
      if (globalT >= T_END) {
        globalT = 0;
        resetSimulation();
      }

      const t = globalT;
      const dissolve = smoothstep(T_THORN_END, T_END, t);

      camera.position.x = Math.sin(t * 0.09) * 0.32;
      camera.position.z = 8.2 + Math.cos(t * 0.06) * 0.32;
      camera.lookAt(0, 0.08, 0);

      updateCore(t, dissolve);
      updateHalo(t, dissolve);
      simulate(dt, t);
      syncBranchVolumeBuffer(dissolve, t);
      updateWrap(t, coreRadiusAt(t), dissolve);
      applyVisualPhase(t, dissolve);

      if (dissolve > 0.02) {
        lineMat.opacity *= 1 - dissolve * 0.5;
        branchVolMat.opacity *= 1 - dissolve * 0.42;
        wrapMat.opacity *= 1 - dissolve * 0.4;
      }

      composer.render();
      requestAnimationFrame(tick);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(tick);
  </script>
</body>
